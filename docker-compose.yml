version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-interview_assistant}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:0.5.5
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai_service:
    build: ./ai_service
    restart: unless-stopped
    env_file:
      - ./ai_service/.env
    ports:
      - "8001:8001"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Inside docker-compose's network, services reach each other by
      # service name, not localhost — these override whatever's in .env
      # (which is written for plain local, non-Docker development).
      DB_HOST: postgres
      AI_SERVICE_URL: http://ai_service:8001
      CHROMA_HTTP_HOST: chroma
      CHROMA_HTTP_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      ai_service:
        condition: service_started
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/auth
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

volumes:
  postgres_data:
  chroma_data:
  n8n_data:
  media_data:
