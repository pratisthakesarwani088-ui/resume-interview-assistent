databases:
  - name: interview-assistant-db
    plan: free
    databaseName: interview_assistant
    user: interview_assistant

services:
  # --- FastAPI AI service --------------------------------------------------
  - type: web
    name: interview-assistant-ai-service
    runtime: docker
    dockerfilePath: ./ai_service/Dockerfile
    dockerContext: ./ai_service
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: AI_SERVICE_INTERNAL_KEY
        generateValue: true

  # --- ChromaDB (vector store), as its own Docker web service with a disk -
  - type: web
    name: interview-assistant-chroma
    runtime: image
    image:
      url: docker.io/chromadb/chroma:0.5.5
    plan: starter
    healthCheckPath: /api/v1/heartbeat
    disk:
      name: chroma-data
      mountPath: /chroma/chroma
      sizeGB: 5

  # --- Django backend -------------------------------------------------------
  - type: web
    name: interview-assistant-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health/
    disk:
      name: backend-media
      mountPath: /app/media
      sizeGB: 5
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: interview-assistant-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: interview-assistant-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        value: https://interview-assistant-frontend.onrender.com
      - key: MAX_RESUME_SIZE_MB
        value: "5"
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: interview-assistant-ai-service
          property: hostport
      - key: AI_SERVICE_INTERNAL_KEY
        sync: false # set to the same generated value as the AI service's AI_SERVICE_INTERNAL_KEY
      - key: CHROMA_HTTP_HOST
        fromService:
          type: web
          name: interview-assistant-chroma
          property: host
      - key: CHROMA_HTTP_PORT
        value: "8000"
      - key: SECURE_SSL_REDIRECT
        value: "True"

  # --- n8n (workflow orchestration) -----------------------------------------
  - type: web
    name: interview-assistant-n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:latest
    plan: starter
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 2
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        generateValue: true
      - key: N8N_HOST
        value: interview-assistant-n8n.onrender.com
      - key: WEBHOOK_URL
        value: https://interview-assistant-n8n.onrender.com/
      - key: DJANGO_API_BASE_URL
        fromService:
          type: web
          name: interview-assistant-backend
          property: hostport
      - key: N8N_API_TOKEN
        sync: false # a long-lived JWT or service token n8n uses to call the Django API

  # --- Frontend: native Render Static Site, not Docker ----------------------
  - type: static
    name: interview-assistant-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://interview-assistant-backend.onrender.com/api/auth
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
